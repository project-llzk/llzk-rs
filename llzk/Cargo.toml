[package]
name = "llzk"
version = "0.7.0"
edition = "2024"
keywords = ["llzk", "mlir"]
categories = ["api-bindings"]
description = "Rust bindings to the LLZK C API."
repository = "https://github.com/project-llzk/llzk-rs"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
llzk-sys = { version = "30.1.1", path = "../llzk-sys/" }
llzk-macro = { version = "0.3.1", path = "../llzk-macro" }
melior = { workspace = true }
mlir-sys = { workspace = true }
log = "0.4"
paste = "1"
num-bigint = { version = "0.5", optional = true }

[dev-dependencies]
rstest = "0.27"
simplelog = { version = "0.12", features = ["test"] }
quickcheck = "1"
quickcheck_macros = "1"
similar-asserts = "2.0"
mlir-testutils = { version = "0.3", features = ["similar-asserts"] }

[features]
default = []
bigint = ["num-bigint"]
pcl-backend = ["llzk-sys/pcl-backend"]

[lints]
workspace = true

[[example]]
name = "division"
