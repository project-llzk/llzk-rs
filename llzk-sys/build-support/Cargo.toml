[package]
name = "llzk-sys-build-support"
version = "1.0.2"
edition = "2024"
keywords = ["llzk", "mlir"]
categories = ["development-tools::build-utils"]
description = "Helpers for building llzk-sys."
repository = "https://github.com/project-llzk/llzk-rs"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
# Temporary upstream fix for bindgen's incompatible syn/prettyplease ranges.
# Return to crates.io after a release includes rust-bindgen#3506.
bindgen = { git = "https://github.com/tamird/rust-bindgen", rev = "86a8a5e774b5c4fcab9f86caa2767549dec2a97e" }
anyhow = "1.0"
cc = "^1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
