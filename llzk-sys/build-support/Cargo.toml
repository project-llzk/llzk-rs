[package]
name = "llzk-sys-build-support"
version = "1.0.2"
edition = "2024"
keywords = ["llzk", "mlir"]
categories = ["development-tools::build-utils"]
description = "Helpers for building llzk-sys."
repository = "https://github.com/project-llzk/llzk-rs"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
# Keep bindgen's syn/prettyplease pair compatible in Cargo.lock; see the root README.
bindgen = "0.73.2"
anyhow = "1.0"
cc = "^1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
